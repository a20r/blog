# PR previews: every open same-repo PR gets a rendered copy of the site at
#   https://a20r.github.io/blog/pr-preview/pr-<N>/
# served from the SAME GitHub Pages deployment as the main site (Pages hosts
# one site per repo, so the deploy workflow assembles main + all open PR
# previews — see the "Build previews for open PRs" step in deploy.yml).
#
# This workflow just reacts to PR events: it dispatches the deploy workflow
# on main (workflow_dispatch/repository_dispatch are the documented
# exceptions to "GITHUB_TOKEN events don't trigger workflows"), and keeps a
# sticky comment on the PR pointing at the preview URL. Running the deploy
# on the main ref keeps the github-pages environment's branch protection
# happy. When a PR closes, the redeploy simply no longer includes it.

name: pr-preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  actions: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Same-repo PRs only: fork PRs must not steer deployments.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch site redeploy on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Sticky preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const closed = context.payload.action === 'closed';
            const url = `https://a20r.github.io/blog/pr-preview/pr-${pr.number}/`;
            const marker = '<!-- pr-preview-comment -->';
            const body = closed
              ? `${marker}\n🔍 PR preview torn down (PR ${pr.merged ? 'merged' : 'closed'}). ` +
                `It disappears from the site on the next deploy.`
              : `${marker}\n🔍 **PR preview:** ${url}\n\n` +
                `Rebuilds on every push to this PR (allow a minute or two for the ` +
                `Pages deploy to finish); removed automatically when the PR closes.`;
            const { owner, repo } = context.repo;
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.data.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
