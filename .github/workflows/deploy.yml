name: Deploy blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Needed to delete duplicate github-pages artifacts (see the prune step).
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Eleventy can derive post dates from git.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build site
        run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # The artifact service can transiently register one upload as several
      # identical artifacts, and deploy-pages refuses to deploy when more than
      # one "github-pages" artifact exists on the run. Keep only the newest.
      - name: Prune duplicate Pages artifacts
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: context.runId,
            });
            const pages = data.artifacts
              .filter((a) => a.name === 'github-pages')
              .sort((a, b) => b.id - a.id);
            for (const dup of pages.slice(1)) {
              core.warning(`Deleting duplicate github-pages artifact ${dup.id}`);
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: dup.id });
            }

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
