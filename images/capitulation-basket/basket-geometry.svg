<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="ui-monospace,Menlo,monospace">
  <rect width="960" height="440" fill="#0b1220"/>
  <!-- shared scale: profit -60..+50 mapped to y 340..(340-400*(v+60)/110)... use y(v)=340-2.6*(v+60); zero line y(0)=184 -->
  <!-- LEFT PANEL: naked draw -->
  <g transform="translate(40,40)">
    <text x="200" y="0" fill="#cfe0f4" font-size="15" text-anchor="middle">before conversion &#8212; naked draw leg</text>
    <text x="200" y="20" fill="#5b6b8c" font-size="12" text-anchor="middle">D = 100 @ C_D = $55</text>
    <rect x="0" y="34" width="400" height="316" fill="#0e1628" stroke="#22314f"/>
    <!-- zero line at y(0)=34+156=190; scale 2.6 px per $ ; y(v) = 190 - 2.6 v -->
    <line x1="0" y1="190" x2="400" y2="190" stroke="#3b4e75" stroke-width="1.2"/>
    <text x="392" y="185" fill="#5b6b8c" font-size="11" text-anchor="end">$0</text>
    <!-- bars: A: -55 => h=143 down; D: +45 => h=117 up; B: -55 -->
    <rect x="45" y="190" width="80" height="143" fill="#ff4fa3" opacity="0.85"/>
    <rect x="160" y="73" width="80" height="117" fill="#00f0ff" opacity="0.9"/>
    <rect x="275" y="190" width="80" height="143" fill="#ff4fa3" opacity="0.85"/>
    <g fill="#cfe0f4" font-size="13" text-anchor="middle">
      <text x="85" y="348">A wins</text><text x="200" y="348">draw</text><text x="315" y="348">B wins</text>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="85" y="326" fill="#ffb3d4">&#8722;$55</text>
      <text x="200" y="66" fill="#aef4ff">+$45</text>
      <text x="315" y="326" fill="#ffb3d4">&#8722;$55</text>
    </g>
    <text x="200" y="372" fill="#ffd166" font-size="12.5" text-anchor="middle">&#928;_min = &#8722;$55 &#8212; any goal kills it</text>
  </g>
  <!-- arrow -->
  <g transform="translate(459,205)">
    <path d="M 0 0 L 28 0" stroke="#57e6ff" stroke-width="3"/>
    <path d="M 28 -7 L 42 0 L 28 7 Z" fill="#57e6ff"/>
    <text x="21" y="-16" fill="#57e6ff" font-size="12" text-anchor="middle">buy tails</text>
    <text x="21" y="26" fill="#5b6b8c" font-size="10.5" text-anchor="middle">q_A=100@18&#162;</text>
    <text x="21" y="41" fill="#5b6b8c" font-size="10.5" text-anchor="middle">q_B=100@17&#162;</text>
  </g>
  <!-- RIGHT PANEL: locked basket -->
  <g transform="translate(520,40)">
    <text x="200" y="0" fill="#cfe0f4" font-size="15" text-anchor="middle">after conversion &#8212; bounded basket</text>
    <text x="200" y="20" fill="#5b6b8c" font-size="12" text-anchor="middle">C = 55 + 18 + 17 = $90</text>
    <rect x="0" y="34" width="400" height="316" fill="#0e1628" stroke="#22314f"/>
    <line x1="0" y1="190" x2="400" y2="190" stroke="#3b4e75" stroke-width="1.2"/>
    <text x="392" y="185" fill="#5b6b8c" font-size="11" text-anchor="end">$0</text>
    <!-- floor line at +10 => y = 190-26 = 164 -->
    <line x1="0" y1="164" x2="400" y2="164" stroke="#9bffb0" stroke-width="1.4" stroke-dasharray="6 4"/>
    <!-- bars: all +10 -->
    <rect x="45" y="164" width="80" height="26" fill="#9bffb0" opacity="0.9"/>
    <rect x="160" y="164" width="80" height="26" fill="#9bffb0" opacity="0.9"/>
    <rect x="275" y="164" width="80" height="26" fill="#9bffb0" opacity="0.9"/>
    <g fill="#cfe0f4" font-size="13" text-anchor="middle">
      <text x="85" y="348">A wins</text><text x="200" y="348">draw</text><text x="315" y="348">B wins</text>
    </g>
    <g font-size="13" text-anchor="middle" fill="#c8ffd4">
      <text x="85" y="156">+$10</text><text x="200" y="156">+$10</text><text x="315" y="156">+$10</text>
    </g>
    <text x="200" y="372" fill="#9bffb0" font-size="12.5" text-anchor="middle">&#928;_min = +$10 &#8212; every outcome pays</text>
  </g>
  <text x="480" y="430" fill="#5b6b8c" font-size="12" text-anchor="middle">the worked example: historical draw basis + compressed win tails &#8594; a floor above zero in all three outcomes</text>
</svg>
